name: Project Build

on:
  push:
  pull_request:
    branches: [ main ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! "${{ github.head_ref }}" =~ ^(major|feature|fix)/ ]]; then
            echo "Branch name must start with 'major/', 'feature/', or 'fix/'."
            echo "Current branch: ${{ github.head_ref }}"
            echo "Examples: feature/add-login, fix/button-click, major/v2-release"
            exit 1
          fi
          echo "Branch name is valid: ${{ github.head_ref }}"

      - name: Skip on push
        if: github.event_name != 'pull_request'
        run: echo "Branch name check skipped for push events."

  build:
    strategy:
      matrix:
        framework: ["net8.0"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: >
          dotnet build tests/MetamaskSetup.Playwright.Tests/MetamaskSetup.Playwright.Tests.csproj
          --framework ${{ matrix.framework }}
          --property WarningLevel=0
          -m:1

  test:
    needs: [check-branch-name, build]
    strategy:
      matrix:
        framework: ["net8.0"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.49.0

      # Rebuild here (fresh runner). Skipped entirely if check-branch-name or build failed.
      - name: Build
        run: >
          dotnet build tests/MetamaskSetup.Playwright.Tests/MetamaskSetup.Playwright.Tests.csproj
          --framework ${{ matrix.framework }}
          --property WarningLevel=0
          -m:1

      - name: Install Playwright Chromium
        run: pwsh tests/MetamaskSetup.Playwright.Tests/bin/Debug/net8.0/playwright.ps1 install chromium

      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run all tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          xvfb-run -a dotnet test tests/MetamaskSetup.Playwright.Tests/MetamaskSetup.Playwright.Tests.csproj
          --framework ${{ matrix.framework }}
          --no-build
          --logger "console;verbosity=normal"
